# Off-database unit tests. No Postgres, no Ollama, no secrets, no hosted models.
# Matches `make test` locally: a project venv, then `python -m pytest` through Make
# (a bare `pytest` on PATH is how this repo used to fail collection).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # framework version (pyproject allows >=3.10)
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install editable package and dev extras
        run: |
          python -m venv .venv                    # Makefile prefers .venv/bin/python
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"       # pytest + ruff; same as `make install`

      - name: Run off-database unit tests
        run: make test                            # $(PYTHON) -m pytest -q

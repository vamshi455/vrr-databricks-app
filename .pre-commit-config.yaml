# Keep the repo's own rules enforceable locally: `pre-commit install` once, then every
# commit runs them. Nothing here needs network access or the running stack.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                     # lint (config lives in pyproject.toml)
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]          # the seeded field is generated, never committed
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: pytest-offdb
        name: pytest (pure, no stack)
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
